name: Deploy

# Publishes the site to GitHub Pages on every push to main. The site is
# static: build_site.sh only copies the published files into _site and checks
# that every local reference resolves, so a broken link fails the deploy
# instead of going live. tool/check_names.sh runs first, so a founder's name
# or the disguise name never goes live either.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no founder's name and no disguise name
        run: ./tool/check_names.sh
        env:
          FOUNDER_NAMES: ${{ secrets.FOUNDER_NAMES }}
          DISGUISE_NAME_CHECK: ${{ secrets.DISGUISE_NAME_CHECK }}
      - run: ./build_site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # enablement switches Pages on for the repository the first time, if the
      # token is allowed to; otherwise Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
